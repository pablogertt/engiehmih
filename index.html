  <style>
    /* Árbol y acordeón */

    .nav-tree-item:hover{background:#4a5568}

    .caret-char{display:inline-block;width:1rem;text-align:center}
    .nav-children{margin-top:4px;padding-left:.75rem;border-left:1px solid #4a5568}

<body class="bg-gray-900 text-gray-200 flex h-screen overflow-hidden">

    <div class="flex gap-2 mb-3">
      <button id="expand-all" class="px-2 py-1 bg-gray-700 rounded">Expandir todo</button>
      <button id="collapse-all" class="px-2 py-1 bg-gray-700 rounded">Colapsar todo</button>
    </div>

  </aside>

  <!-- Contenido -->

          <div id="screen-placeholder" class="text-center text-gray-500 py-8">
            <p class="text-2xl font-semibold">Placeholder 16:9</p>
            <p class="mt-1">Aquí se mostrará el diseño final de la pantalla.</p>
            <p class="mt-1">(Formato 16:9)</p>
          </div>
        </div>
      </div>

      <div id="next-level-container" class="mt-8 max-w-6xl mx-auto">
        <h3 class="text-xl font-semibold text-gray-300 border-b border-gray-700 pb-2 mb-4">Ir a Nivel Inferior:</h3>
        <div id="next-level-buttons" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
      </div>
    </main>

    <footer class="bg-gray-800 p-3 flex items-center justify-between border-t border-gray-700 shadow-inner">
      <button id="back-button" class="flex items-center space-x-2 bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200 disabled:opacity-50 disabled:cursor-not-allowed">Regresar</button>
      <button id="bookmark-button" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200">Agregar a Bookmarks</button>
    </footer>
  </div>

/******************* 2) Estado *******************/
const OPEN_NODES_KEY = 'hmiOpenNodes';
const openNodes = new Set(JSON.parse(localStorage.getItem(OPEN_NODES_KEY) || '[]'));
const saveOpenNodes = () => localStorage.setItem(OPEN_NODES_KEY, JSON.stringify([...openNodes]));

/******************* 3) DOM *******************/
const navTreeContainer = document.getElementById('nav-tree');
const screenTitle = document.getElementById('screen-title');
const screenDescription = document.getElementById('screen-description');
const breadcrumbsEl = document.getElementById('breadcrumbs');
const screenPlaceholder = document.getElementById('screen-placeholder');
const nextLevelButtons = document.getElementById('next-level-buttons');
const nextLevelContainer = document.getElementById('next-level-container');
const backButton = document.getElementById('back-button');
const bookmarkButton = document.getElementById('bookmark-button');

/******************* 4) Árbol *******************/
function renderNavTree(){
  navTreeContainer.innerHTML = '';
  navTreeContainer.appendChild(createTreeLevel(['L0_GENERAL']));
}

function createTreeLevel(ids){
  const ul = document.createElement('ul');
  ids.forEach(id => {
    const s = hmiData[id]; if(!s) return;
    const li = document.createElement('li');

    const row = document.createElement('div');
    row.className = 'nav-tree-item';

    if (s.children && s.children.length){
      const caret = document.createElement('span');
      caret.className = 'caret-char select-none';
      caret.textContent = openNodes.has(id) ? '▲' : '▼';
      caret.title = 'Expandir/contraer';
      caret.addEventListener('click', (e)=>{
        e.stopPropagation();
        if(openNodes.has(id)) openNodes.delete(id); else openNodes.add(id);
        saveOpenNodes(); renderNavTree();
      });
      row.appendChild(caret);

      const title = document.createElement('span');
      title.className = 'truncate';
      title.textContent = s.title;
      title.addEventListener('click', (e)=>{ e.stopPropagation(); navigateTo(id); });
      row.appendChild(title);
    } else {
      row.innerHTML = `<span class='caret-char'></span><span class='truncate'>${s.title}</span>`;
      row.addEventListener('click', ()=> navigateTo(id));
    }

    li.appendChild(row);

    if (s.children && s.children.length){
      const childrenWrap = document.createElement('div');
      childrenWrap.className = `nav-children ${openNodes.has(id) ? '' : 'nav-hidden'}`;
      childrenWrap.appendChild(createTreeLevel(s.children));
      li.appendChild(childrenWrap);
    }

    ul.appendChild(li);
  });
  return ul;
}

/******************* 5) Contenido *******************/
function renderBreadcrumbs(screenId){
  const path = [];
  let cur = hmiData[screenId];
  while(cur){ path.unshift(cur); cur = cur.parent ? hmiData[cur.parent] : null; }
  breadcrumbsEl.innerHTML = '';
  path.forEach((node, i) => {
    const a = document.createElement('a');
    a.href = '#'; a.textContent = node.title;
    if (i < path.length - 1){ a.onclick = e=>{ e.preventDefault(); navigateTo(node.id); }; }
    else { a.classList.add('font-semibold','text-white'); }
    breadcrumbsEl.appendChild(a);
    if (i < path.length - 1){ const sep = document.createElement('span'); sep.textContent=' / '; sep.className='sep'; breadcrumbsEl.appendChild(sep); }
  });
}

function navigateTo(screenId){
  const s = hmiData[screenId]; if(!s){ console.warn('Pantalla no encontrada:', screenId); return; }
  console.log('[NAV] ->', screenId);
  screenTitle.textContent = s.title;
  screenDescription.textContent = s.desc || '';
  document.title = `HMI • ${s.title}`;
  renderBreadcrumbs(screenId);
  // === Mostrar imagen si existe; de lo contrario, placeholder ===
const content = document.getElementById('screen-content');

if (s.img) {
  content.innerHTML = `
    <div class="relative w-full" style="aspect-ratio: 16 / 9;">
      <img src="${s.img}" alt="${s.title}"
           class="absolute inset-0 w-full h-full object-cover rounded-lg shadow-lg border border-gray-700" />
    </div>
  `;
} else {
  content.innerHTML = `
    <div class="flex items-center justify-center h-full text-gray-500">
      <div class="text-center">
        <p class="text-2xl font-semibold">Sin vista asignada</p>
        <p class="mt-1 text-sm opacity-80">(Esta pantalla no tiene imagen)</p>
      </div>
    </div>
  `;
}
;
  renderNextLevelButtons(s.children);
  backButton.disabled = !s.parent;
  backButton.onclick = s.parent ? (()=>navigateTo(s.parent)) : null;
  updateBookmarkButton(screenId);
  let cur = s; while(cur && cur.parent){ openNodes.add(cur.parent); cur = hmiData[cur.parent]; }
  saveOpenNodes(); renderNavTree();
}

function renderNextLevelButtons(children){
  nextLevelButtons.innerHTML = '';
  if(!children || !children.length){ nextLevelContainer.style.display='none'; return; }
  nextLevelContainer.style.display='block';
  children.forEach(id=>{
    const c = hmiData[id]; if(!c) return;
    const btn = document.createElement('button');
    btn.className = 'w-full text-left bg-gray-700 hover:bg-gray-600 text-white font-medium py-3 px-4 rounded-lg shadow-md transition duration-200';
    btn.textContent = c.title;
    btn.title = c.desc || '';
    btn.addEventListener('click', ()=>{ console.log('[CLICK child]', id); navigateTo(id); });
    nextLevelButtons.appendChild(btn);
  });
}

let bookmarks = JSON.parse(localStorage.getItem('hmiBookmarks') || '[]');
function updateBookmarkButton(id){
  const on = bookmarks.includes(id);
  bookmarkButton.textContent = on ? 'Quitar Bookmark' : 'Agregar a Bookmarks';
  bookmarkButton.className = 'flex items-center space-x-2 ' + (on ? 'bg-yellow-600 hover:bg-yellow-700' : 'bg-blue-600 hover:bg-blue-700') + ' text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200';
  bookmarkButton.onclick = ()=>{
    const i = bookmarks.indexOf(id);
    if(i>-1) bookmarks.splice(i,1); else bookmarks.push(id);
    localStorage.setItem('hmiBookmarks', JSON.stringify(bookmarks));
    updateBookmarkButton(id);
  };
}

/******************* 6) Expandir/Colapsar *******************/
const expandAllBtn = document.getElementById('expand-all');
const collapseAllBtn = document.getElementById('collapse-all');
expandAllBtn.addEventListener('click', () => {
  Object.keys(hmiData).forEach(k => { if (hmiData[k].children && hmiData[k].children.length) openNodes.add(k); });
  saveOpenNodes(); renderNavTree();
});
collapseAllBtn.addEventListener('click', () => {
  openNodes.clear(); saveOpenNodes(); renderNavTree();
});

/******************* 7) Inicio *******************/
document.addEventListener('DOMContentLoaded', () => {
  openNodes.add('L0_GENERAL'); saveOpenNodes();
  renderNavTree();
  navigateTo('L0_GENERAL');
});
</script>
